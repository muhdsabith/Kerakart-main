name: kerakart
description: A minimal premium shopping app with an offline demo catalog.
publish_to: none
version: 1.0.10+11
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/products.png
    - assets/images/catalog-expanded.png
    - assets/images/kerabasket_logo.png
